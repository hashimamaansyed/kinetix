<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#180538"/>
      <stop offset="60%" stop-color="#0e0322"/>
      <stop offset="100%" stop-color="#08080c"/>
    </radialGradient>

    <!-- Vinyl Disc Radial Gradient -->
    <radialGradient id="disc-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4a0e80"/>
      <stop offset="45%" stop-color="#2a085c"/>
      <stop offset="90%" stop-color="#140432"/>
      <stop offset="100%" stop-color="#08080c"/>
    </radialGradient>

    <!-- Center Label Gradient -->
    <radialGradient id="center-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#2a085c"/>
      <stop offset="100%" stop-color="#08080c"/>
    </radialGradient>

    <!-- Lime Green Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="particle-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Background with Rounded Corners -->
  <rect width="512" height="512" rx="104" fill="url(#bg-grad)"/>
  <rect width="508" height="508" x="2" y="2" rx="102" fill="none" stroke="rgba(147, 51, 234, 0.4)" stroke-width="2"/>

  <!-- Outer 8D Orbital Ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="rgba(147, 51, 234, 0.25)" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- Vinyl Disc Outer Body -->
  <circle cx="256" cy="256" r="190" fill="url(#disc-grad)" stroke="#9333ea" stroke-width="3" filter="drop-shadow(0 0 24px rgba(42, 8, 92, 0.8))"/>

  <!-- Concentric Grooves -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="rgba(147, 51, 234, 0.22)" stroke-width="1.2"/>
  <circle cx="256" cy="256" r="162" fill="none" stroke="rgba(147, 51, 234, 0.18)" stroke-width="1.2"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="rgba(147, 51, 234, 0.22)" stroke-width="1.2"/>
  <circle cx="256" cy="256" r="134" fill="none" stroke="rgba(147, 51, 234, 0.18)" stroke-width="1.2"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(147, 51, 234, 0.22)" stroke-width="1.2"/>
  <circle cx="256" cy="256" r="106" fill="none" stroke="rgba(147, 51, 234, 0.18)" stroke-width="1.2"/>

  <!-- Center Spindle & Label -->
  <circle cx="256" cy="256" r="80" fill="url(#center-grad)" stroke="#39ff14" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="24" fill="#08080c" stroke="#39ff14" stroke-width="2"/>

  <!-- Cyber Emblem K Waveform -->
  <path d="M 238 216 L 238 296 M 238 256 L 274 216 M 252 242 L 276 296"
        fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Glowing 8D Panning Orbital Particle -->
  <circle cx="474" cy="256" r="14" fill="#39ff14" filter="url(#particle-glow)"/>
  <circle cx="474" cy="256" r="6" fill="#ffffff"/>
</svg>
